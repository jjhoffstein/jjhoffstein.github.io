<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alpha Site Tracker | JJ Hoffstein Digital Portfolio</title>
<meta name="description" content="A local-first dashboard for scoring and tracking potential expansion sites.">
<link rel="canonical" href="https://jjhoffstein.github.io/alpha-site-scorer/">
<link rel="stylesheet" href="../assets/css/alpha-site-scorer-base.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="../assets/css/fontawesome-all.min.css"><link rel="stylesheet" href="../assets/css/fonts.css" />
		<link rel="stylesheet" href="../assets/css/main.css"><link rel="stylesheet" href="../assets/css/alpha-site-scorer.css">
<link rel="icon" href="../images/globe-64.jpg" type="image/jpeg">
</head>
<body class="is-preload alpha-site-scorer"><div id="wrapper"><header id="header"><div class="inner"><a href="../index.html" class="logo"><span class="symbol"><img src="../images/globe-64.jpg" alt="" width="64" height="64"></span><span class="title">JJ Hoffstein</span></a><nav><ul><li><a href="#menu">Menu</a></li></ul></nav></div></header><nav id="menu" data-menu-src="../menu.html" aria-label="Site navigation"></nav><main id="main"><div class="inner"><div class="container">
<header class="dashboard-header"><h1>Alpha Site Tracker</h1><p class="subtitle">Site viability scores out of 84, with pipeline tracking.</p></header>
<p id="data-warning" class="data-warning" role="status" hidden></p>
<section aria-label="Dashboard"><div class="summary" id="summary"></div><div class="funnel" id="funnel"></div>
<div class="view-toggle"><button onclick="showView('grid')" id="btn-grid" class="active">Cards</button><button onclick="showView('kanban')" id="btn-kanban">Kanban</button><button onclick="showView('map')" id="btn-map">Map</button></div><p id="map-status" class="map-status" role="status" hidden></p><div id="map"></div>
<div class="kanban" id="kanban"></div><div class="action-controls">
<button class="btn btn-primary" id="add-site" onclick="addNewSite()">+ Add New Site</button>
<button class="btn btn-secondary" onclick="exportSites()">Export</button>
<button class="btn btn-secondary" onclick="document.getElementById('import-file').click()">Import</button><input id="import-file" type="file" accept=".json,application/json" onchange="importSites(event)" hidden>
</div>
<div class="grid" id="grid"></div></section>
</div></div></main><footer id="footer"><div class="inner"><section><h2>Contact</h2><ul class="icons"><li><a href="https://www.linkedin.com/in/jj-hoffstein-9433921b" class="icon brands style2 fa-linkedin-in" aria-label="LinkedIn"><span class="label">LinkedIn</span></a></li><li><a href="https://github.com/jjhoffstein" class="icon brands style2 fa-github" aria-label="GitHub"><span class="label">GitHub</span></a></li><li><a href="https://www.twitter.com/jjhoffstein" class="icon brands style2 fa-twitter" aria-label="Twitter"><span class="label">Twitter</span></a></li><li><a href="mailto:jjhoffstein@gmail.com" class="icon solid style2 fa-envelope" aria-label="Email"><span class="label">Email</span></a></li></ul></section><ul class="copyright"><li>&copy; JJ Hoffstein</li><li><a href="../privacy.html">Privacy</a></li><li>Design: <a href="https://html5up.net">HTML5 UP</a></li></ul></div></footer></div>
<div class="modal" id="editModal" role="dialog" aria-modal="true" aria-labelledby="edit-title" aria-hidden="true" inert><div class="modal-content">
<h2 id="edit-title">Edit Site</h2>
<div class="form-group"><label for="edit-name">Name</label><input type="text" id="edit-name"></div>
<div class="form-group"><label for="edit-address">Address</label><input type="text" id="edit-address"></div>
<div class="form-group"><label for="edit-zip">Zip Code</label><input type="text" id="edit-zip"></div>
<div class="form-group"><label for="edit-sqft">Square Footage</label><input type="number" id="edit-sqft"></div>
<div class="form-group"><label for="edit-rent">Monthly Rent ($)</label><input type="number" id="edit-rent"></div>
<div class="form-group checkbox-group"><input type="checkbox" id="edit-driveway"><label for="edit-driveway">Has Driveway</label></div>
<div class="form-group checkbox-group"><input type="checkbox" id="edit-outdoor"><label for="edit-outdoor">Has Outdoor Space</label></div>
<div class="form-group checkbox-group"><input type="checkbox" id="edit-kitchen"><label for="edit-kitchen">Has Kitchen Area</label></div>
<div class="form-group"><label for="edit-notes">Notes</label><textarea id="edit-notes" rows="3" style="width:100%;padding:8px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:0.9rem;font-family:inherit;resize:vertical" placeholder="Broker contact, next steps, blockers..." maxlength="500" oninput="document.getElementById('char-count').textContent=this.value.length+'/500'"></textarea><div class="char-count" id="char-count">0/500</div></div><div class="form-group"><label for="edit-status">Status</label><select id="edit-status"><option value="Sourced">Sourced</option><option value="Site Visit">Site Visit</option><option value="LOI">LOI</option><option value="Negotiation">Negotiation</option><option value="Signed">Signed</option></select></div><div class="form-group checkbox-group"><input type="checkbox" id="edit-zoning"><label for="edit-zoning">Zoning Clear</label></div>
<div class="btn-row"><button class="btn btn-primary" onclick="saveSite()">Save</button><button class="btn btn-secondary" onclick="closeModal()">Cancel</button><button class="btn btn-danger" id="delete-site" onclick="deleteSite()">Delete</button></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="../assets/js/site-dialog.js"></script>
<script src="../assets/js/alpha-site-data.js"></script>
<script src="../assets/js/alpha-site-scorer.js" defer></script><div class="modal" id="costModal" role="dialog" aria-modal="true" aria-labelledby="cost-site-name" aria-hidden="true" inert><div class="modal-content" style="max-width:600px">
<h2 id="cost-site-name">Cost Breakdown</h2>
<div style="display:flex;gap:24px;flex-wrap:wrap">
<div style="flex:1;min-width:200px"><canvas id="costChart" height="200"></canvas></div>
<div style="flex:1;min-width:200px">
<div style="font-size:1.5rem;font-weight:700;color:#0f172a" id="cost-total"></div>
<div style="color:#64748b;margin-bottom:16px">Annual Operating Cost</div>
<div style="display:flex;gap:16px;margin-bottom:16px">
<div style="text-align:center;padding:12px;background:#dcfce7;border-radius:8px;flex:1"><div style="font-size:1.25rem;font-weight:600;color:#16a34a" id="cost-breakeven"></div><div style="font-size:0.75rem;color:#64748b">Break-even</div></div>
<div style="text-align:center;padding:12px;background:#f1f5f9;border-radius:8px;flex:1"><div style="font-size:1.25rem;font-weight:600" id="cost-capacity"></div><div style="font-size:0.75rem;color:#64748b">Capacity</div></div>
</div>
<div id="cost-margin" style="padding:12px;border-radius:8px;text-align:center;margin-bottom:16px"></div>
</div>
</div>
<div id="cost-details" style="margin-top:16px;border-top:1px solid #e2e8f0;padding-top:16px"></div>
<div class="btn-row"><button class="btn btn-secondary" onclick="closeCostModal()">Close</button></div>
</div></div><script src="../assets/js/jquery.min.js"></script><script src="../assets/js/browser.min.js"></script><script src="../assets/js/breakpoints.min.js"></script><script src="../assets/js/util.js"></script><script src="../assets/js/main.js"></script></body></html>
