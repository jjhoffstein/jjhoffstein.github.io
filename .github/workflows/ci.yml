name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        # https://github.com/actions/checkout#usage
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node.js 24 LTS
        # https://github.com/actions/setup-node#usage
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Run site tests
        run: node --test tests/*.test.mjs

  browser-checks:
    name: Browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install browser test dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check desktop and mobile pages and interactions
        run: npm run test:browser
      - name: Save browser previews and verification
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-previews
          path: tmp/browser-checks/
          if-no-files-found: ignore
